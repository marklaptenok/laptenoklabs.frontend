media:
  - name: assets
    label: Assets
    input: src/assets
    output: ../../../assets
    categories: [image, document]

definitions:
  post_fields: &post_fields
    - name: title
      label: Title
      type: string
      required: true
    - name: description
      label: Description
      type: text
      required: true
    - name: pubDate
      label: Published
      type: date
      required: true
    - name: updatedDate
      label: Updated
      type: date
    - name: heroImage
      label: Hero image
      type: image
    - name: tags
      label: Tags
      type: string
      list: true

  project_fields: &project_fields
    - name: title
      label: Title
      type: string
      required: true
    - name: description
      label: Description
      type: text
      required: true
    - name: pubDate
      label: Published
      type: date
      required: true
    - name: updatedDate
      label: Updated
      type: date
    - name: heroImage
      label: Hero image
      type: image
    - name: tags
      label: Tags
      type: string
      list: true

  author_fields: &author_fields
    - name: id
      label: ID
      type: string
      required: true
    - name: name
      label: Name
      type: string
      required: true
    - name: role
      label: Role
      type: string
    - name: bio
      label: Bio
      type: text
    - name: avatar
      label: Avatar
      type: image
    - name: location
      label: Location
      type: string
    - name: focus
      label: Focus areas
      type: string
      list: false

  post_view: &post_view
    fields: [title, pubDate, updatedDate, tags]
    sort: [pubDate, title]
    default:
      sort: pubDate
      order: desc

  project_view: &project_view
    fields: [title, pubDate, updatedDate]
    sort: [pubDate]
    default:
      sort: pubDate
      order: desc

  author_view: &author_view
    fields: [name, role, location]
    sort: [name]
    default:
      sort: name
      order: asc

content:
  - name: blog_en
    label: Posts — English
    type: collection
    path: src/content/blog/en
    filename: '{year}-{month}-{day}-{primary}.md'
    view: *post_view
    fields: *post_fields

  - name: blog_ru
    label: Записи — Русский
    type: collection
    path: src/content/blog/ru
    filename: '{year}-{month}-{day}-{primary}.md'
    view: *post_view
    fields: *post_fields

  - name: projects_en
    label: Projects — English
    type: collection
    path: src/content/projects/en
    filename: '{primary}.md'
    view: *project_view
    fields: *project_fields

  - name: projects_ru
    label: Проекты — Русский
    type: collection
    path: src/content/projects/ru
    filename: '{primary}.md'
    view: *project_view
    fields: *project_fields

  - name: authors_en
    label: Authors — English
    type: collection
    path: src/content/authors/en
    format: yaml
    filename: '{primary}.yml'
    view: *author_view
    fields: *author_fields

  - name: authors_ru
    label: Авторы — Русский
    type: collection
    path: src/content/authors/ru
    format: yaml
    filename: '{primary}.yml'
    view: *author_view
    fields: *author_fields

  - name: testimonials
    label: Testimonials
    type: file
    path: src/content/testimonials.yml
    format: yaml

  - name: socials
    label: Socials
    type: file
    path: src/content/socials.yml
    format: yaml
