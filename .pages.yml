media:
  - name: assets
    label: Assets
    input: src/assets
    output: ../../../assets
    categories: [image, document]

definitions:
  post_fields: &post_fields
    - name: title
      label: Title
      type: string
      required: true
    - name: description
      label: Description
      type: text
      required: true
    - name: pubDate
      label: Published
      type: date
      required: true
    - name: updatedDate
      label: Updated
      type: date
    - name: heroImage
      label: Hero image
      type: image
    - name: tags
      label: Tags
      type: string
      list: true

  project_fields: &project_fields
    - name: title
      label: Title
      type: string
      required: true
    - name: description
      label: Description
      type: text
      required: true
    - name: pubDate
      label: Published
      type: date
      required: true
    - name: updatedDate
      label: Updated
      type: date
    - name: heroImage
      label: Hero image
      type: image
    - name: tags
      label: Tags
      type: string
      list: true

  post_view: &post_view
    fields: [title, pubDate, updatedDate, tags]
    sort: [pubDate, title]
    default:
      sort: pubDate
      order: desc

  project_view: &project_view
    fields: [title, pubDate, updatedDate]
    sort: [pubDate]
    default:
      sort: pubDate
      order: desc

content:
  - name: articles_en
    label: Articles — English
    type: collection
    path: src/content/articles/en
    filename: '{year}-{month}-{day}-{primary}.md'
    view: *post_view
    fields: *post_fields

  - name: articles_ru
    label: Статьи — Русский
    type: collection
    path: src/content/articles/ru
    filename: '{year}-{month}-{day}-{primary}.md'
    view: *post_view
    fields: *post_fields

  - name: projects_en
    label: Projects — English
    type: collection
    path: src/content/projects/en
    filename: '{primary}.md'
    view: *project_view
    fields: *project_fields

  - name: projects_ru
    label: Проекты — Русский
    type: collection
    path: src/content/projects/ru
    filename: '{primary}.md'
    view: *project_view
    fields: *project_fields

  - name: socials
    label: Socials
    type: file
    path: src/content/socials.yml
    format: yaml
