name: Mark Laptenok
altName: Марк Лаптёнок
headline: A communicator and a technical leader with a fundamental background in applied mathematics and systems programming. Major SWE expertise is in communication among systems. A teacher. Interested in kernel mode programming and distributed OSes.
contacts:
  - Pilsen, The Czech Republic
  - mark@laptenoklabs.com

sections:
  - title: Professional experience
    entries:
      - org: Microsoft Corporation
        roles:
          - Senior Software Engineer, January 2026 – present.
        notes:
          - In the Craft & Reliability team of the Microsoft Teams desktop client for Windows and macOS, responsible for reaching 99.9% reliability.
          - Designed, implemented with custom AI agents, and delivered web-content identification of failed WebView2 renderers; delivered statistics on the most fail-prone web applications to the area owner.
          - Researching Out-of-Memory failures; designed a tool to track and distinguish causes of OOM states, with further improvements to resilience.
          - "Side project: analysed the Teams desktop client SDLC gaps and introduced a list of solutions to the infrastructure teams. Proposed a mathematical model for greedy E2E testing of code changes; verification in progress."

      - org: Diebold Nixdorf
        roles:
          - Advanced Software Engineer, July 2022 – December 2025.
        notes:
          - Designed the endpoint communication module for the next-generation monitoring and remote-control system for banking and retail; implemented the resilience layer and the data serialization based on schema exchange.
          - As DRI, refactored and delivered the communication stack of the proprietary remote-control and monitoring software for banking — a project initiated by Bank of America that took two years to complete.
          - Fixed database connection issues.

      - org: Laptenok Labs
        roles:
          - Software Engineering Teacher and Consultant, March 2019 – present.
        notes:
          - As of 1 September 2026, completed 4,525 hours of classes in Computer Networks, Operating Systems, SQL/NoSQL Databases, Parallel Computations (pthreads, OpenMP, C++ STL, WinAPI), Algorithms and Data Structures, Software Engineering, Probability Theory, Discrete Mathematics, and various programming languages.
          - Tutored 172 people, including Amdocs interns and students of Imperial College London, the University of Bremen, the University of Auckland, Moscow State University and Moscow Engineering Physics Institute, to improve their engineering and programming skills.

