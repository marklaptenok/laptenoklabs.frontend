sections:
  - title: Опыт работы
    entries:
      - org: Microsoft Corporation
        roles:
          - Старший инженер-программист, январь 2026 — настоящее время.
        notes:
          - В команде Craft & Reliability настольного клиента Microsoft Teams для Windows и macOS отвечает за достижение надёжности 99,9%.
          - Спроектировал, реализовал с помощью собственных ИИ-агентов и выпустил определение веб-содержимого для отказавших рендереров WebView2; передал владельцу направления статистику по наиболее проблемным веб-приложениям.
          - Исследует отказы из-за нехватки памяти (OOM); спроектировал инструмент для отслеживания и различения причин OOM с последующим повышением отказоустойчивости.
          - "Побочный проект: проанализировал пробелы в жизненном цикле разработки настольного клиента Teams и предложил инфраструктурным командам список решений. Предложил математическую модель жадного E2E-тестирования изменений кода; проверка продолжается."

      - org: Diebold Nixdorf
        roles:
          - Ведущий инженер-программист, июль 2022 — декабрь 2025.
        notes:
          - Спроектировал модуль коммуникации конечных устройств для системы мониторинга и удалённого управления нового поколения для банков и ритейла; реализовал часть, отвечающую за отказоустойчивость, и сериализацию данных на основе обмена схемами.
          - В роли DRI переработал и выпустил коммуникационный стек проприетарного ПО удалённого управления и мониторинга для банков — проект, инициированный Bank of America, занял два года.
          - Исправил проблемы с подключением к базам данных.

      - org: Laptenok Labs
        roles:
          - Преподаватель программной инженерии и консультант, март 2019 — настоящее время.
        notes:
          - На 1 сентября 2026 года проведено 4 525 часов занятий по компьютерным сетям, операционным системам, SQL/NoSQL базам данных, параллельным вычислениям (pthreads, OpenMP, C++ STL, WinAPI), алгоритмам и структурам данных, программной инженерии, теории вероятностей, дискретной математике и различным языкам программирования.
          - Обучил 172 человека, включая стажёров Amdocs и студентов Imperial College London, Бременского университета, Оклендского университета, МГУ и МИФИ.

      - org: Silixcon
        roles:
          - Инженер-программист, март 2020 — июнь 2022.
        notes:
          - Спроектировал и реализовал парсер Python, встроенный в настольный клиент на C++ для проприетарных контроллеров двигателей.
          - Спроектировал API, модель прав пользователей и настольный клиент для системы удалённой регистрации, обновления и мониторинга контроллеров двигателей.
          - Переработал систему удалённого обновления прошивок и спроектировал её среду выполнения на основе виртуализации третьего типа.

