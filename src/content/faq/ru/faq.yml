title: Вопросы и ответы
description: Чем занимается Laptenok Labs, кто делает работу, где мы находимся и как начать.
intro: Короткие ответы на то, о чём спрашивают до первого письма.
items:
  - question: Чем занимается Laptenok Labs?
    answer: >-
      Laptenok Labs — компания по разработке программного обеспечения в Пльзене, Чехия. Мы делаем
      три вещи: аудит ИТ-систем, создание алгоритмов и математических моделей для оптимизации
      процессов и аудит инженерных команд. Параллельно мы обучаем инженерии программ и
      наставляем инженеров.
  - question: Что входит в аудит ИТ-системы?
    answer: >-
      Анализ рисков, документирование, рефакторинг, переписывание, исправление ошибок, добавление
      функциональности, поиск сопровождающих и обучение тех, кто будет поддерживать систему.
  - question: Что входит в аудит инженерной команды?
    answer: >-
      Помощь в найме и в построении среды, которая остаётся продуктивной годами, а не кварталами.
  - question: Какую алгоритмическую работу вы берёте?
    answer: >-
      Формализация процесса, проектирование и анализ алгоритмов, параллельные вычисления и
      измерение реального эффекта. В основе — прикладная математика и системное программирование.
  - question: Кто делает работу?
    answer: >-
      Марк Лаптёнок — сооснователь, инженер-программист и преподаватель. Старший инженер-программист
      в Microsoft, по квалификации математик и системный программист, преподаёт с 2009 года:
      4 525 часов занятий со 172 людьми, включая стажёров и студентов Imperial College London,
      университетов Бремена и Окленда и МГУ.
  - question: Чему учит Laptenok Labs?
    answer: >-
      Компьютерным сетям, операционным системам, базам данных, алгоритмам и структурам данных,
      параллельным вычислениям. O(log n) — собственная учебная платформа компании для
      инженеров-программистов.
  - question: На каких языках вы работаете?
    answer: На английском, русском и чешском.
  - question: Где вы находитесь и с кем работаете?
    answer: >-
      Компания зарегистрирована в Пльзене, Чехия, как Laptenok Labs s.r.o. (IČO 21777641). Люди,
      которых мы учили, находятся в Великобритании, Германии, Новой Зеландии и России.
  - question: Как начать?
    answer: >-
      Напишите на mark@laptenoklabs.com. Рабочие часы — 10:00 – 18:00 UTC, телефон
      (420) 732 662 170.
